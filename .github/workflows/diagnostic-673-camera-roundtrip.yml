name: Level Editor camera round-trip 673 (diagnostic only)
on:
  push:
    branches: ['dot/diagnostic-673-camera-roundtrip-20261120']
    paths: ['.github/workflows/diagnostic-673-camera-roundtrip.yml']
permissions:
  contents: read
jobs:
  camera-roundtrip:
    name: Protected Chromium camera round-trip (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [original-observed, legal-observed]
    env:
      REVISION: '9265553ab21803af258010bf85be6056c4288241'
      EXPECTED_TREE: 'b2670e979703908cf8d41aaf4c0f1e1acc3e0df6'
      VARIANT: ${{ matrix.variant }}
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fence exact checkout and apply only named observation overlay
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          spec=tests/playwright/editor-flows.spec.js
          test "$(git hash-object "$spec")" = db6ae4600de5019902f479ac17846fdcfdcec6d5
          test "$(git rev-parse HEAD:src/ui/LevelEditorCore.js)" = 31eca071ff02d20eac16c08131037cec5539cc9d
          test "$(git rev-parse HEAD:src/game/Input.js)" = 5a32a8508a78633c474034bb67f06c7e692fe5c0
          test "$(git rev-parse HEAD:package-lock.json)" = 71d9cce5e4c06f526b49a6d80c0eae694a8f3f6f
          test "$(git rev-parse HEAD:playwright.config.js)" = 9e93a2ca786f76d8617ee53994a21ddee5bccb67
          test "$(git rev-parse HEAD:tools/playwright/static-server.cjs)" = a6d55f8749e170a93e9237f4ea1389526a03404b
          overlay="$RUNNER_TEMP/673-camera.patch"
          case "$VARIANT" in
            original-observed)
              sha=7963ad2742bbb82ff13291c65e349e7bdd92b0083dbc212f156eddfd110a0fe6; blob=f39e3ba669c97b11ef2031927130755541b21d19
              printf '%s' '' | base64 -d > "$overlay" ;;
            legal-observed)
              sha=4299b806c49596c36700f24679c21018c987ee0746ca26285669614233556e43; blob=44c8bb66036e10095afb1652395c17afa4ffe5a9
              printf '%s' '' | base64 -d > "$overlay" ;;
            *) exit 13 ;;
          esac
          printf '%s  %s\n' "$sha" "$overlay" | sha256sum -c -
          git apply --check "$overlay"
          git apply "$overlay"
          test "$(git hash-object "$spec")" = "$blob"
          test "$(git diff --name-only)" = "$spec"
          git diff --exit-code -- .github src tools assets data package.json package-lock.json playwright.config.js

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install only the pinned release dependencies and Playwright Chromium
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --input-type=commonjs <<'JS'
          const assert=require('node:assert/strict');
          for(const name of ['@playwright/test','playwright','playwright-core']){
            assert.equal(require(name+'/package.json').version,'1.58.2',name);
          }
          JS
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Verify headless Chromium is adequately sandboxed
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,channel:'chromium',chromiumSandbox:true});
          try{
            const page=await browser.newPage();
            await page.goto('chrome://sandbox');
            const status=await page.locator('body').innerText();
            console.log(browser.version(),status);
            assert.match(status,/You are adequately sandboxed/i);
            await page.goto('data:text/html,<title>sandbox-ready</title>');
            assert.equal(await page.title(),'sandbox-ready');
          }finally{await browser.close();}
          JS

      - name: Exercise the single unchanged or test-only diagnostic case
        run: |
          set -euo pipefail
          config=.pw-673-camera-roundtrip-diagnostic.config.js
          test ! -e "$config"
          trap 'rm -f "$config"' EXIT
          cat > "$config" <<'CONFIG'
          import {defineConfig} from '@playwright/test';
          import base from './playwright.config.js';
          export default defineConfig({
            ...base,
            retries:0,
            use:{...base.use,channel:'chromium',trace:'retain-on-failure',
              launchOptions:{...base.use?.launchOptions,chromiumSandbox:true}}
          });
          CONFIG
          grep='^.*regression: editor survives playtest round trip and still handles input$'
          PW=(./node_modules/.bin/playwright test --config="$config" tests/playwright/editor-flows.spec.js --grep "$grep")
          "${PW[@]}" --list | tee "$RUNNER_TEMP/pw-673-list.txt"
          test "$(grep -c '› regression: editor survives playtest round trip and still handles input$' "$RUNNER_TEMP/pw-673-list.txt")" = 1
          grep -Fx 'Total: 1 test in 1 file' "$RUNNER_TEMP/pw-673-list.txt"
          "${PW[@]}" --workers=1 --retries=0 --repeat-each=3 --reporter=line,json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: camera-673-${{ matrix.variant }}
          path: test-results
          if-no-files-found: warn
