name: Local-fit stock preview batch 02
on:
  push:
    branches: [dot/diagnostic-stock-preview-batch-02]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aefadc41cbbe2e7756f8f6ef0cb2728c6fec5168
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact offline-prepared diagnostic tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = aefadc41cbbe2e7756f8f6ef0cb2728c6fec5168
          test "$(git rev-parse HEAD^)" = 29a5f3f9abbcdb0e3e512455971aba18384450f5
          test "$(git rev-parse HEAD^{tree})" = 31df0588eb6cf82cee1915ea483fe187bd4f630d
          test "$(git rev-parse HEAD:.github)" = 9acb7dae8496ff32e0f8ce6e6b4f1a216bc74980
          test -z "$(git status --porcelain)"
          printf '%s  %s\n' '4828ff9953f909d789e49773816584dddba17e4c536276208c65b1f086b48a0e' 'data/server-storage/files/art/catalog-bellheather-2005-body/document.json' | sha256sum --check --strict
          printf '%s  %s\n' 'acbea4470c6894b7e9ee43bea1de628bf19e49643dc64ec84dc1af1c6543ee1b' 'data/server-storage/files/art/catalog-bellheather-2005-dashboard/document.json' | sha256sum --check --strict
          printf '%s  %s\n' '977e93379f0609b4b6738934604f6cdb695bf0b8902df2b7ad5fc087b5e00fad' 'data/server-storage/files/art/catalog-bellheather-2005-tires/document.json' | sha256sum --check --strict
          printf '%s  %s\n' '93830546b73baa679adb311396813edd5951007560a3ec07ebf8cb556ee65642' 'data/server-storage/files/art/catalog-bogbean-2020-body/document.json' | sha256sum --check --strict
          printf '%s  %s\n' '0c40fa83569c641e8ca1ed4ed9711492a6b321f6c65006d42611dc4d6c460d57' 'data/server-storage/files/art/catalog-bogbean-2020-dashboard/document.json' | sha256sum --check --strict
          printf '%s  %s\n' '4096587ec6e1bed9036ecc4f959f5d8634e7952241f9aefe542003fb72a38214' 'data/server-storage/files/art/catalog-bogbean-2020-tires/document.json' | sha256sum --check --strict
          printf '%s  %s\n' 'df794d2eea1f84e5415ee72bd700a2d7333f031fe99bbe032365b43d55018b8f' 'data/server-storage/files/art/catalog-fumitory-1983-body/document.json' | sha256sum --check --strict
          printf '%s  %s\n' 'd1525defd0e74c909c6221eca34f8bb670256a84c1635053e59df5eddc0f680e' 'data/server-storage/files/art/catalog-fumitory-1983-dashboard/document.json' | sha256sum --check --strict
          printf '%s  %s\n' 'e5844d28be2b63c3da4da8c023e5705de55f4c1242e715be50f008903e6ab7a1' 'data/server-storage/files/art/catalog-fumitory-1983-tires/document.json' | sha256sum --check --strict
          printf '%s  %s\n' '7b3b4cc2f335e27775e3cb656796bbe11923dcf27a1801b1de63801ed4551c41' 'data/server-storage/files/cars/Bellheather 2005/document.json' | sha256sum --check --strict
          printf '%s  %s\n' '4774e990a3240213911283699790f573e2973c482060d016b2077b0db318a834' 'data/server-storage/files/cars/Bogbean 2020/document.json' | sha256sum --check --strict
          printf '%s  %s\n' '052c7bc62b5d63ca1b977728236163581cccfe9a1b43c0089ad4907a843c4dd8' 'data/server-storage/files/cars/Fumitory 1983/document.json' | sha256sum --check --strict
          printf '%s  %s\n' 'f965789d1aecf8220da1bcea7310daee72652606eaac0d7360e429b799e06569' 'playwright.stock-matrix.config.mjs' | sha256sum --check --strict
          printf '%s  %s\n' '620625823686766539b9708c790be0c1eb89e933bf1dd0cc9b6dd717ad2066f3' 'tests/playwright/matrix.json' | sha256sum --check --strict
          printf '%s  %s\n' '3a979da4912cffa8c362438396a5deed66cc8394e505ca85ade2fff19dfb6fe1' 'tests/playwright/stock-render-matrix.spec.js' | sha256sum --check --strict
          printf '%s  %s\n' '3f2f3cb249f379f73f76e6d6ea1240ec989ff6e76863c7c82512c12dae66290f' 'tests/playwright/stock-verify.mjs' | sha256sum --check --strict
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Preflight protected Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch({headless:true,chromiumSandbox:true});
          try {
            const page=await browser.newPage();
            await page.goto('data:text/html,<title>Protected preview batch browser</title>');
            if(await page.title()!=='Protected preview batch browser')throw Error('Protected browser preflight failed');
          } finally { await browser.close(); }
          JS
      - name: Render three menu atlases and Load Save posters
        run: npx --no-install playwright test -c playwright.stock-matrix.config.mjs --workers=1 --reporter=line
        env:
          CI: 'true'
          CAR_PREVIEW_LANE: batch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-preview-three-car-render-batch-02
          path: |
            test-results/**/*-preview-row.json
            test-results/**/*-render-receipt.json
            test-results/**/*.webp
          retention-days: 3
          if-no-files-found: ignore
