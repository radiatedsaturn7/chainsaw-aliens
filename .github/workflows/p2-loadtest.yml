name: P2 endurance load test
on:
  push:
    branches: [codex/p2-loadtest, codex/p2-loadtest-final]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  lap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Cancel superseded P2 test runs
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'p2-loadtest.yml', branch: context.ref.replace('refs/heads/', ''), per_page: 10
            });
            for (const run of data.workflow_runs) {
              if (run.id < context.runId && ['queued', 'in_progress'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Full lap with 11 AI cars at 60 Hz
        run: node tools/loadtest/run-p2.mjs
        env:
          P2_REPORT: artifacts/p2loadtest/ci-lap-60hz.json
          P2_DT: '0.016666666666666666'
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-loadtest
          path: artifacts/p2loadtest/
