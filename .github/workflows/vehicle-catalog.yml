name: Vehicle catalog validation
on:
  pull_request:
    branches: [staging]
    paths:
      - 'assets/car-catalog/**'
      - 'data/vehicle-catalog/**'
      - 'scripts/car-catalog-import.mjs'
      - 'data/server-storage/files/cars/**'
      - 'data/server-storage/files/tires/**'
      - 'data/server-storage/files/art/catalog-*/**'
      - 'tests/**/carCatalog*'
      - 'tests/playwright/car-catalog*.spec.js'
      - '.github/workflows/vehicle-catalog.yml'
permissions:
  contents: read
concurrency:
  group: vehicle-catalog-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=2 tests/unit/quinceCatalog.test.js tests/unit/mosslingCatalog.test.js tests/unit/cicadaCatalog.test.js tests/unit/nettleCatalog.test.js tests/unit/rosefinchCatalog.test.js tests/unit/larchCatalog.test.js tests/unit/glimmerCatalog.test.js tests/unit/marigoldCatalog.test.js tests/unit/vesperCatalog.test.js tests/unit/brambleCatalog.test.js tests/unit/sundewCatalog.test.js tests/unit/pipitCatalog.test.js tests/unit/cairnCatalog.test.js tests/unit/ashbaronCatalog.test.js tests/unit/gossamerCatalog.test.js tests/unit/stormlineCatalog.test.js tests/unit/rotorveilCatalog.test.js tests/unit/carCatalogLegacyRedraw.test.js tests/unit/flintCatalog.test.js tests/unit/cinderCatalog.test.js tests/unit/larkCatalog.test.js tests/unit/carCatalogKestrelRedraw.test.js tests/unit/sunstrikerCatalog.test.js tests/unit/staggeredTires.test.js tests/unit/briarCatalog.test.js tests/unit/catalogCockpitAnchors.test.js tests/unit/carGauges.test.js tests/unit/nightcoilCatalog.test.js tests/unit/catalogCameraSmoke.test.js tests/unit/catalogWheelCoverage.test.js tests/unit/emberPodCatalog.test.js tests/unit/sentinelSource.test.js tests/unit/sentinelCvt.test.js tests/unit/cvtTransmission.test.js tests/unit/trailglassCatalog.test.js tests/unit/carCatalogImport.test.js tests/unit/catalogRallyTire.test.js tests/unit/catalogRainTire.test.js tests/unit/voltHoundElectric.test.js tests/unit/dustjackCatalog.test.js tests/unit/catalogTireVariety.test.js tests/unit/carGraphicImport.test.js tests/unit/carPresets.test.js tests/unit/carTireTextureFit.test.js tests/unit/carWheelCylinder.test.js
      - run: python tools/project_manifest.py --check --validate-assets
      - run: npx playwright test tests/playwright/car-catalog-legacy-cockpit.spec.js tests/playwright/car-catalog-cockpit.spec.js tests/playwright/car-catalog.spec.js tests/playwright/car-catalog-preview.spec.js tests/playwright/car-graphic-import.spec.js tests/playwright/car-presets.spec.js --workers=1 --reporter=line
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-catalog-browser-results
          path: test-results
