name: Merge Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: merge-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Editor UI unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run editor and race regression unit tests
        run: node --test tests/unit/editorMenuLayout.test.js tests/unit/editorMenuSpec.test.js tests/unit/portraitEditorMenuModels.test.js tests/unit/raceImageTrace.test.js tests/unit/raceImportedCircuitRegression.test.js tests/unit/raceTireTrackRenderer.test.js tests/unit/steeringCommandMapping.test.js tests/unit/racePauseRestart.test.js

      - name: Run AI car selection and driving tests
        run: node --test tests/unit/carPerformance.test.js tests/unit/raceAiCarSelectionPersistence.test.js tests/unit/raceAiDriving.test.js tests/unit/raceAiProjection.test.js tests/unit/raceAiRecovery.test.js

      - name: Run menu designer and runtime tests
        run: node --test tests/unit/menu*.test.js tests/unit/carDirectionalArt.test.js tests/unit/raceTravel.test.js

      - name: Run radio and mix tape tests
        run: node --test tests/unit/itemEffects.test.js tests/unit/itemSystem.test.js tests/unit/radioEditor.test.js tests/unit/radioPlayer.test.js tests/unit/mixTapePickup.test.js tests/unit/doodadEditor.test.js tests/unit/raceDoodads.test.js tests/unit/pauseMenu.test.js tests/unit/titleLayout.test.js

      - name: Run 3D model editor and runtime tests
        run: node --test tests/unit/model3d*.test.js

      - name: Run race physics feel unit tests
        run: npm run test:race-physics-feel

  race-physics-feel-browser:
    name: Race physics feel browser test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run race physics feel browser test
        run: npm run test:race-physics-feel:browser -- --reporter=line

  playwright:
    name: Playwright editor contract tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/4
            artifact: 1-of-4
          - shard: 2/4
            artifact: 2-of-4
          - shard: 3/4
            artifact: 3-of-4
          - shard: 4/4
            artifact: 4-of-4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npm run test:playwright -- --config=playwright.editor.config.js --reporter=line --workers=1 --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload menu preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-previews-${{ matrix.artifact }}
          path: |
            test-results/menu-*.png
            test-results/radio-*.png
            test-results/item-*.png
          if-no-files-found: ignore
          retention-days: 7
