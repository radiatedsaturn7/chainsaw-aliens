name: CVT powertrain validation
on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/racing/**'
      - 'src/ui/RaceEditor.js'
      - 'tests/**cvt*'
      - 'tests/unit/cvt*'
      - 'tests/playwright/cvt*'
      - 'tests/fixtures/electric*'
      - '.github/workflows/cvt-powertrain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cvt-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/unit/cvtTransmission.test.js tests/unit/electricPowertrain*.test.js tests/unit/automaticKickdown.test.js tests/unit/powertrainAllocationParity.test.js tests/unit/raceAiRemotePowertrain.test.js tests/unit/vehicleDynamicsReplay.test.js tests/unit/vehicleDynamicsControls.test.js tests/unit/raceVehicleDynamicsWorkerBridge.test.js tests/unit/raceVehicleDynamicsWorkerMigration.test.js tests/unit/raceLaunchControl.test.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/playwright/cvt-editor.spec.js tests/playwright/electric-editor.spec.js --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvt-editor-screenshots
          path: test-results
