<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTG Studio</title>
  <style>
    #studio-boot { position:fixed; inset:0; z-index:2147483646; display:grid; place-content:center; gap:16px; padding:24px; text-align:center; background:#080c14; color:#f8fbff; font:16px system-ui,sans-serif; }
    #studio-boot h1 { margin:0; font-size:32px; }
    #studio-boot p { margin:0; color:#c6dcf5; }
    #studio-boot-error { max-width:min(90vw,720px); max-height:35dvh; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; text-align:left; font:13px monospace; }
    #studio-boot button { padding:10px 24px; font:inherit; }
  </style>
  <link rel="modulepreload" href="src/main.js?v=startup-565" />
  <link rel="preload" as="style" href="css/ui-suite.css" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" as="style" href="styles.css" onload="this.onload=null;this.rel='stylesheet'" />
</head>
<body>
  <section id="studio-boot" aria-label="RTG Studio startup">
    <h1>RTG Studio</h1>
    <p id="studio-boot-status" role="status">Loading RTG Studio…</p>
    <pre id="studio-boot-error" hidden></pre>
    <button id="studio-boot-retry" type="button" hidden>Reload</button>
    <noscript>Enable JavaScript to run RTG Studio.</noscript>
  </section>
  <main class="frame">
    <canvas id="game" width="1280" height="720"></canvas>
    <div class="hint">Press SPACE for dialog / confirm</div>
  </main>
  <script type="module" src="src/bootstrap.js?v=startup-565"></script>
  <script defer src="vendor/soundfont-player.min.js"></script>
  <script defer src="vendor/jszip.min.js"></script>
  <script defer src="vendor/midi.min.js"></script>
  <script id="studio-main" type="module" src="src/main.js?v=startup-565"></script>
</body>
</html>
